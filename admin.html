<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Ouvidoria - Delipack</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#0B2A4A;--azul2:#123c6a} *{margin:0;padding:0;box-sizing:border-box} body{font-family:Inter,sans-serif;background:#F2F5F8}
#login{height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#0B2A4A,#123c6a);padding:20px}
.box{background:white;padding:28px;border-radius:18px;width:100%;max-width:360px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.logo-login{display:flex;justify-content:center;margin-bottom:14px}.logo-login img{height:36px;object-fit:contain}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}
.brand img{height:28px;background:white;border-radius:8px;padding:4px 8px}
header{background:linear-gradient(135deg,var(--azul),var(--azul2));color:white;padding:12px 3%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1.5px solid #ddd;margin:6px 0;outline:none;font-size:14px}
.btn{background:var(--azul);color:white;padding:13px;border:none;border-radius:10px;width:100%;font-weight:700;cursor:pointer}
.container{padding:16px 3%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.05)}.kpi{font-size:26px;font-weight:800;color:var(--azul)}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.filters input{flex:1;min-width:200px}.filters select{min-width:180px;flex:1;max-width:240px}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.kanban-col{background:#E8EEF4;border-radius:16px;padding:10px;min-height:70vh;transition:.2s}
.kanban-col.drag-over{background:#D6E8FF;transform:scale(1.01)}
.kanban-head{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--azul);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.kanban-head span:last-child{background:var(--azul);color:white;padding:2px 8px;border-radius:10px;font-size:11px}
.kanban-card{background:white;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.06);border-left:4px solid var(--azul);cursor:grab}
.kanban-card:active{cursor:grabbing;opacity:.6}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}.Novo{background:#FFF4CC}.Em{background:#D6E8FF}.Respondido{background:#D1FAE5}.Concluído{background:#c8f7c5}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);justify-content:center;align-items:center;z-index:99;padding:16px}
.modal-box{background:white;padding:22px;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.kanban{grid-template-columns:1fr}.kanban-col{min-height:auto}}
</style>
</head><body>
<div id="login"><div class="box"><div class="logo-login"><img src="logo.png"></div><h2 style="color:var(--azul);text-align:center;font-size:18px">Painel Gerencial da Ouvidoria</h2><p style="font-size:12px;color:#666;margin:6px 0 14px;text-align:center">Acesso Restrito</p><input id="u" placeholder="E-mail"><input id="p" type="password" placeholder="Senha"><button class="btn" id="btnLogin" onclick="logar()">Acessar Painel</button><p id="erro" style="color:red;font-size:12px;margin-top:8px"></p></div></div>

<div id="app" style="display:none"><header><div class="brand"><img src="logo.png"> PAINEL GERENCIAL DE OUVIDORIA</div><div style="display:flex;gap:8px;align-items:center"><button onclick="carregar()" style="padding:9px 14px;border-radius:10px;border:none;background:#10B981;color:white;font-weight:800;cursor:pointer;font-size:12px">🔄 Atualizar</button><button onclick="exportar()" style="padding:9px 14px;border-radius:10px;border:none;background:white;color:var(--azul);font-weight:800;cursor:pointer;font-size:12px">Excel</button><button onclick="sair()" style="padding:9px 14px;border-radius:10px;border:none;background:rgba(255,255,255,.2);color:white;cursor:pointer">Sair</button></div></header><div class="container"><div class="kpis"><div class="card"><div style="font-size:10px;color:#666">TOTAL</div><div class="kpi" id="kpiTotal">0</div></div><div class="card"><div style="font-size:10px;color:#666">ANÔNIMOS</div><div class="kpi" id="kpiAnon">0</div></div><div class="card"><div style="font-size:10px;color:#666">NOVOS</div><div class="kpi" id="kpiNovos">0</div></div><div class="card"><div style="font-size:10px;color:#666">CONCLUÍDOS</div><div class="kpi" id="kpiResp">0</div></div></div>
<div class="filters"><input id="busca" placeholder="🔍 Buscar..." oninput="render()"><select id="fTipo" onchange="render()"><option value="">Todos os tipos</option><option>Denúncia</option><option>Reclamação</option><option>Assédio Moral / Sexual</option><option>Sugestão</option><option>Elogio</option><option>Dúvida</option></select></div>
<div class="kanban" id="kanban"></div></div></div>

<div class="modal" id="modal"><div class="modal-box"><h3 style="color:var(--azul)">Gerenciar caso</h3><div style="background:#F8FAFC;padding:14px;border-radius:12px;font-size:13px;margin:12px 0;border:1px solid #E2E8F0" id="modalInfo"></div><label style="font-size:12px;font-weight:800">✅ O que foi feito?</label><textarea id="acao" rows="5"></textarea><div style="margin-top:10px"><label style="font-size:12px;font-weight:800">📌 Status</label><select id="statusFinal"><option>Novo</option><option>Em Análise</option><option>Respondido</option><option>Concluído</option><option>Arquivado</option></select></div><button class="btn" style="margin-top:14px" onclick="salvarResposta()">Salvar e atualizar</button><button onclick="fechar()" style="margin-top:8px;width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;background:white;cursor:pointer">Fechar</button></div></div>

<script>
let lista=[],idAtivo=null,token=localStorage.getItem('delipack_token');
async function logar(){
  const b=document.getElementById('btnLogin');
  const e=document.getElementById('erro');
  b.textContent='Entrando...';b.disabled=true;e.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('u').value.trim(),password:document.getElementById('p').value})});
    const j=await r.json();
    if(!r.ok){e.textContent=j.error||'Login inválido';b.textContent='Acessar Painel';b.disabled=false;return;}
    token=j.token;localStorage.setItem('delipack_token',token);mostrar();
  }catch(err){
    e.textContent='Servidor acordando... aguarde 20s e tente de novo';
    b.textContent='Acessar Painel';b.disabled=false;
  }
}
function mostrar(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  carregar();
  setInterval(()=>{carregar(true)},30000);
}
async function carregar(silencioso=false){
  try{
    const r=await fetch('/api/relatos',{headers:{Authorization:'Bearer '+token}});
    if(!r.ok){sair();return;}
    lista=await r.json();
    render();
    if(!silencioso) console.log('Atualizado');
  }catch(e){console.log('erro ao carregar')}
}
function render(){
  let l=[...lista];
  let q=document.getElementById('busca').value.toLowerCase();
  let ft=document.getElementById('fTipo').value;
  if(q) l=l.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  if(ft) l=l.filter(x=>x.tipo==ft);
  document.getElementById('kpiTotal').textContent=lista.length;
  document.getElementById('kpiAnon').textContent=lista.filter(x=>x.anonimo).length;
  document.getElementById('kpiNovos').textContent=lista.filter(x=>x.status=='Novo').length;
  document.getElementById('kpiResp').textContent=lista.filter(x=>['Respondido','Concluído'].includes(x.status)).length;
  let cols=[{id:'Novo',label:'🆕 Novo'},{id:'Em Análise',label:'👀 Em Análise'},{id:'Respondido',label:'✅ Respondido'},{id:'Concluído',label:'🏁 Concluído'}];
  let html='';
  cols.forEach(c=>{
    let itens=[];
    if(c.id=='Novo') itens=l.filter(x=>(x.status||'Novo')=='Novo');
    if(c.id=='Em Análise') itens=l.filter(x=>(x.status||'Novo')=='Em Análise');
    if(c.id=='Respondido') itens=l.filter(x=>(x.status||'Novo')=='Respondido');
    if(c.id=='Concluído') itens=l.filter(x=>(x.status||'Novo')=='Concluído');
    html+='<div class="kanban-col" data-status="'+c.id+'" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="leave(event)"><div class="kanban-head"><span>'+c.label+'</span><span>'+itens.length+'</span></div>';
    itens.forEach(r=>{
      html+='<div class="kanban-card" draggable="true" ondragstart="drag(event,\''+r.id+'\')" onclick="abrir(\''+r.id+'\')"><b style="font-size:12px">'+r.tipo+'</b><div style="font-size:11px;color:#666;margin:4px 0">🕒 '+(r.data_br||'')+' • 📍 '+(r.local||'-')+'</div><div style="font-size:12px;line-height:1.3">'+(r.descricao||'').substring(0,110)+'...</div><div style="margin-top:8px;font-size:11px;display:flex;justify-content:space-between"><span>'+(r.anonimo?'🕵️ Anônimo':'👤 '+r.nome)+'</span><span style="color:#888">'+(r.setor||'')+'</span></div></div>';
    });
    html+='</div>';
  });
  document.getElementById('kanban').innerHTML=html;
}
function allowDrop(ev){ev.preventDefault();ev.currentTarget.classList.add('drag-over');}
function leave(ev){ev.currentTarget.classList.remove('drag-over');}
function drag(ev,id){ev.dataTransfer.setData("text",id);}
async function drop(ev){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag-over');
  let id=ev.dataTransfer.getData("text");
  let novoStatus=ev.currentTarget.getAttribute('data-status');
  let r=lista.find(x=>x.id==id);
  if(!r) return;
  if((r.status||'Novo')==novoStatus) return;
  try{
    await fetch('/api/relatos/'+id,{
      method:'PUT',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
      body:JSON.stringify({
        status:novoStatus,
        acao_tomada:r.acao_tomada||'',
        resposta_admin:r.resposta_admin||r.acao_tomada||'',
        data_resposta:new Date().toLocaleString('pt-BR')
      })
    });
    carregar();
  }catch(err){alert('Erro ao mover');}
}
function abrir(id){
  idAtivo=id;
  let r=lista.find(x=>x.id==id);
  document.getElementById('modalInfo').innerHTML='<div style="display:flex;justify-content:space-between"><b>'+r.tipo+'</b><span class="badge '+(r.status||'Novo').split(' ')[0]+'">'+(r.status||'Novo')+'</span></div><div style="margin:6px 0">👤 <b>'+(r.anonimo?'Anônimo':r.nome)+'</b> • '+(r.setor||'')+'<br>📍 '+(r.local||'-')+' • 🕒 '+(r.data_br||'')+'</div><hr style="margin:8px 0;border:none;border-top:1px solid #eee"><div style="white-space:pre-wrap">'+(r.descricao||'')+'</div>';
  document.getElementById('acao').value=r.acao_tomada||r.resposta_admin||'';
  document.getElementById('statusFinal').value=r.status||'Novo';
  document.getElementById('modal').style.display='flex';
}
function fechar(){document.getElementById('modal').style.display='none';}
async function salvarResposta(){
  const r=await fetch('/api/relatos/'+idAtivo,{
    method:'PUT',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
    body:JSON.stringify({
      acao_tomada:document.getElementById('acao').value,
      resposta_admin:document.getElementById('acao').value,
      status:document.getElementById('statusFinal').value,
      data_resposta:new Date().toLocaleString('pt-BR')
    })
  });
  if(!r.ok){alert('Erro ao salvar');return;}
  fechar();carregar();
}
function exportar(){
  let csv='Data,Tipo,Nome,Setor,Local,Descricao,Status,Resposta\n';
  lista.forEach(r=>{csv+='"'+(r.data_br||'')+'","'+r.tipo+'","'+r.nome+'","'+r.setor+'","'+r.local+'","'+(r.descricao||'').replace(/"/g,'""')+'","'+r.status+'","'+(r.acao_tomada||'').replace(/"/g,'""')+'"\n';});
  let blob=new Blob([csv],{type:'text/csv'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='ouvidoria-delipack.csv';a.click();
}
function sair(){localStorage.removeItem('delipack_token');location.reload();}
if(token){mostrar();}
</script>
</body></html>
