<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Painel de Ouvidoria - Delipack</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#0B2A4A;--azul2:#123c6a} *{margin:0;padding:0;box-sizing:border-box} body{font-family:Inter,sans-serif;background:#F2F5F8}
#login{height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#0B2A4A,#123c6a);padding:20px}
.box{background:white;padding:28px;border-radius:18px;width:100%;max-width:360px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.logo-login{display:flex;justify-content:center;margin-bottom:14px}.logo-login img{height:36px!important;object-fit:contain!important}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}
.brand img{height:28px!important;background:white;border-radius:8px;padding:4px 8px;object-fit:contain!important}
header{background:linear-gradient(135deg,var(--azul),var(--azul2));color:white;padding:12px 3%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1.5px solid #ddd;margin:6px 0;outline:none;font-size:14px}
.btn{background:var(--azul);color:white;padding:13px;border:none;border-radius:10px;width:100%;font-weight:700;cursor:pointer}
.container{padding:16px 3%}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.05)}.kpi{font-size:26px;font-weight:800;color:var(--azul)}
.view-toggle{display:flex;gap:8px;margin-bottom:12px}
.view-toggle button{padding:8px 14px;border-radius:20px;border:1.5px solid var(--azul);background:white;color:var(--azul);font-weight:700;cursor:pointer;font-size:12px}
.view-toggle button.active{background:var(--azul);color:white}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters input{flex:1;min-width:200px}.filters select{min-width:160px;flex:1}
.table-wrap{background:white;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.05);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:850px}th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}th{background:var(--azul);color:white;font-size:11px;text-transform:uppercase}
.btn-ver{padding:8px 14px;border-radius:20px;border:none;background:#EEF2FF;color:var(--azul);font-weight:800;cursor:pointer;font-size:12px}
.btn-ver:hover{background:var(--azul);color:white}
/* KANBAN */
.kanban{display:none;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.kanban-col{background:#E8EEF4;border-radius:16px;padding:10px;min-height:400px}
.kanban-head{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--azul);margin-bottom:10px;display:flex;justify-content:space-between}
.kanban-card{background:white;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.06);border-left:4px solid var(--azul);cursor:pointer}
.kanban-card.Denúncia{border-color:#EF4444}.kanban-card.Reclamação{border-color:#F59E0B}.kanban-card.Sugestão{border-color:#10B981}.kanban-card.Elogio{border-color:#3B82F6}.kanban-card.Assédio{border-color:#7C3AED}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}.Novo{background:#FFF4CC}.Em{background:#D6E8FF}.Respondido{background:#D1FAE5}.Concluído{background:#c8f7c5}.Arquivado{background:#e5e7eb}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);justify-content:center;align-items:center;z-index:99;padding:16px}
.modal-box{background:white;padding:22px;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.cards{display:none;grid-template-columns:1fr;gap:12px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.table-wrap{display:none!important}.cards{display:grid}.kanban{grid-template-columns:1fr}.kanban-col{min-height:auto}}
</style>
</head><body>
<div id="login"><div class="box"><div class="logo-login"><img src="logo.png" alt="Deli Pack"></div><h2 style="color:var(--azul);text-align:center;font-size:18px">Painel Gerencial da Ouvidoria</h2><p style="font-size:12px;color:#666;margin:6px 0 14px;text-align:center">Acesso Restrito</p><input id="u" placeholder="E-mail"><input id="p" type="password" placeholder="Senha"><button class="btn" id="btnLogin" onclick="logar()">Acessar Painel</button><p id="erro" style="color:red;font-size:12px;margin-top:8px"></p></div></div>
<div id="app" style="display:none"><header><div class="brand"><img src="logo.png"> PAINEL DE OUVIDORIA</div><div style="display:flex;gap:8px"><button onclick="exportar()" style="padding:9px 14px;border-radius:10px;border:none;background:white;color:var(--azul);font-weight:800;cursor:pointer;font-size:12px">Exportar Excel</button><button onclick="sair()" style="padding:9px 14px;border-radius:10px;border:none;background:rgba(255,255,255,.2);color:white;cursor:pointer">Sair</button></div></header><div class="container"><div class="kpis"><div class="card"><div style="font-size:10px;color:#666">TOTAL</div><div class="kpi" id="kpiTotal">0</div></div><div class="card"><div style="font-size:10px;color:#666">ANÔNIMOS</div><div class="kpi" id="kpiAnon">0</div></div><div class="card"><div style="font-size:10px;color:#666">NOVOS</div><div class="kpi" id="kpiNovos">0</div></div><div class="card"><div style="font-size:10px;color:#666">CONCLUÍDOS</div><div class="kpi" id="kpiResp">0</div></div></div>
<div class="view-toggle"><button id="btnLista" class="active" onclick="setView('lista')">📋 Lista</button><button id="btnKanban" onclick="setView('kanban')">🗂️ Kanban por Status</button></div>
<div class="filters"><input id="busca" placeholder="🔍 Buscar por nome, setor, relato..." oninput="render()"><select id="fTipo" onchange="render()"><option value="">Todos os tipos</option><option>Denúncia</option><option>Reclamação</option><option>Assédio Moral / Sexual</option><option>Sugestão</option><option>Elogio</option><option>Dúvida</option></select><select id="fStatus" onchange="render()"><option value="">Todos os status</option><option value="Novo">Novo</option><option value="Em Análise">Em Análise</option><option value="Respondido">Respondido</option><option value="Concluído">Concluído</option><option value="Arquivado">Arquivado</option></select></div>
<div class="table-wrap" id="tableWrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Quem</th><th>Local</th><th>Resumo</th><th>Status</th><th>Ação</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="kanban" id="kanban"></div>
<div class="cards" id="cards"></div></div></div>
<div class="modal" id="modal"><div class="modal-box"><h3 style="color:var(--azul)">Gerenciar caso</h3><div style="background:#F8FAFC;padding:14px;border-radius:12px;font-size:13px;margin:12px 0;border:1px solid #E2E8F0" id="modalInfo"></div><label style="font-size:12px;font-weight:800">✅ O que foi feito? / Resposta para o colaborador</label><textarea id="acao" rows="5" placeholder="Ex: Obrigado pelo relato. Conversamos com o setor e já tomamos a providência..."></textarea><div style="margin-top:10px"><label style="font-size:12px;font-weight:800">📌 Mover para status</label><select id="statusFinal"><option>Novo</option><option>Em Análise</option><option>Respondido</option><option>Concluído</option><option>Arquivado</option></select></div><button class="btn" style="margin-top:14px" onclick="salvarResposta()">Salvar e atualizar caso</button><button onclick="fechar()" style="margin-top:8px;width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;background:white;cursor:pointer">Fechar</button></div></div>
<script>
let lista=[],idAtivo=null,token=localStorage.getItem('delipack_token'),view='lista';
async function logar(){const b=document.getElementById('btnLogin');const e=document.getElementById('erro');b.textContent='Entrando...';b.disabled=true;e.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('u').value.trim(),password:document.getElementById('p').value})});const j=await r.json();if(!r.ok){e.textContent=j.error||'Login inválido';b.textContent='Acessar Painel';b.disabled=false;return;}token=j.token;localStorage.setItem('delipack_token',token);mostrar();}catch{ e.textContent='Servidor acordando... aguarde 20s';b.textContent='Acessar Painel';b.disabled=false;}}
function mostrar(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';carregar();}
async function carregar(){try{const r=await fetch('/api/relatos',{headers:{Authorization:'Bearer '+token}});if(!r.ok){sair();return;}lista=await r.json();render();}catch{}}
function setView(v){view=v;document.getElementById('btnLista').classList.toggle('active',v=='lista');document.getElementById('btnKanban').classList.toggle('active',v=='kanban');render();}
function render(){let l=[...lista];let q=document.getElementById('busca').value.toLowerCase(),ft=document.getElementById('fTipo').value,fs=document.getElementById('fStatus').value;if(q)l=l.filter(x=>JSON.stringify(x).toLowerCase().includes(q));if(ft)l=l.filter(x=>x.tipo==ft);if(fs)l=l.filter(x=>(x.status||'Novo')==fs);document.getElementById('kpiTotal').textContent=lista.length;document.getElementById('kpiAnon').textContent=lista.filter(x=>x.anonimo).length;document.getElementById('kpiNovos').textContent=lista.filter(x=>x.status=='Novo').length;document.getElementById('kpiResp').textContent=lista.filter(x=>['Respondido','Concluído'].includes(x.status)).length;
const tb=document.getElementById('tbody');const cs=document.getElementById('cards');tb.innerHTML='';cs.innerHTML='';
l.forEach(r=>{let d=(r.descricao||'').substring(0,80);let b='<span class="badge '+(r.status||'Novo').split(' ')[0]+'">'+(r.status||'Novo')+'</span>';tb.innerHTML+='<tr><td>'+(r.data_br||'')+'</td><td><b>'+r.tipo+'</b></td><td>'+(r.anonimo?'🕵️ Anônimo':'🙋 '+r.nome)+'<br><small style="color:#666">'+(r.setor||'')+'</small></td><td>'+(r.local||'-')+'</td><td style="max-width:200px">'+d+'...</td><td>'+b+'</td><td><button class="btn-ver" onclick="abrir(\''+r.id+'\')">Ver detalhes</button></td></tr>';cs.innerHTML+='<div class="kanban-card '+r.tipo+'" onclick="abrir(\''+r.id+'\')"><div style="display:flex;justify-content:space-between"><b>'+r.tipo+'</b><span class="badge '+(r.status||'Novo').split(' ')[0]+'">'+(r.status||'Novo')+'</span></div><div style="font-size:12px;margin:6px 0;color:#555">📍 '+(r.local||'-')+' • '+(r.data_br||'')+'</div><div style="font-size:13px">'+d+'...</div></div>';});
if(view=='kanban'){document.getElementById('tableWrap').style.display='none';document.getElementById('kanban').style.display='grid';renderKanban(l);}else{document.getElementById('tableWrap').style.display='block';document.getElementById('kanban').style.display='none';}
}
function renderKanban(l){let cols=['Novo','Em Análise','Respondido','Concluído'];let html='';cols.forEach(c=>{let itens=l.filter(x=>(x.status||'Novo')==c||(c=='Respondido'&&['Respondido','Concluído'].includes(x.status)));html+='<div class="kanban-col"><div class="kanban-head"><span>'+c+'</span><span>'+itens.length+'</span></div>';itens.forEach(r=>{html+='<div class="kanban-card '+r.tipo+'" onclick="abrir(\''+r.id+'\')"><b style="font-size:12px">'+r.tipo+'</b><div style="font-size:11px;color:#666;margin:4px 0">'+(r.data_br||'')+' • '+(r.local||'-')+'</div><div style="font-size:12px">'+(r.descricao||'').substring(0,100)+'...</div><div style="margin-top:6px;font-size:11px">'+(r.anonimo?'🕵️ Anônimo':r.nome)+'</div></div>';});html+='</div>';});document.getElementById('kanban').innerHTML=html;}
function abrir(id){idAtivo=id;let r=lista.find(x=>x.id==id);document.getElementById('modalInfo').innerHTML='<div style="display:flex;justify-content:space-between"><b>'+r.tipo+'</b><span class="badge '+(r.status||'Novo').split(' ')[0]+'">'+(r.status||'Novo')+'</span></div><div style="margin:6px 0">👤 <b>'+(r.anonimo?'Anônimo':r.nome)+'</b> • '+(r.setor||'')+'<br>📍 '+(r.local||'-')+' • 🕒 '+(r.data_br||'')+'</div><hr style="margin:8px 0;border:none;border-top:1px solid #eee"><div style="white-space:pre-wrap">'+(r.descricao||'')+'</div>'+(r.acao_tomada?'<div style="margin-top:10px;background:#F0FDF4;padding:8px;border-radius:8px;border:1px solid #BBF7D0"><b>Resposta atual:</b><br>'+r.acao_tomada+'</div>':'');document.getElementById('acao').value=r.acao_tomada||r.resposta_admin||'';document.getElementById('statusFinal').value=r.status||'Novo';document.getElementById('modal').style.display='flex';}
function fechar(){document.getElementById('modal').style.display='none';}
async function salvarResposta(){const r=await fetch('/api/relatos/'+idAtivo,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({acao_tomada:document.getElementById('acao').value,resposta_admin:document.getElementById('acao').value,status:document.getElementById('statusFinal').value,data_resposta:new Date().toLocaleString('pt-BR')})});if(!r.ok){alert('Erro ao salvar');return;}fechar();carregar();}
function exportar(){let csv='Data,Tipo,Nome,Setor,Local,Descricao,Status,Resposta\n';lista.forEach(r=>{csv+='"'+(r.data_br||'')+'","'+r.tipo+'","'+r.nome+'","'+r.setor+'","'+r.local+'","'+(r.descricao||'').replace(/"/g,'""')+'","'+r.status+'","'+(r.acao_tomada||'').replace(/"/g,'""')+'"\n';});let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ouvidoria-delipack.csv';a.click();}
function sair(){localStorage.removeItem('delipack_token');location.reload();}
if(token){mostrar();}
</script>
</body></html>
